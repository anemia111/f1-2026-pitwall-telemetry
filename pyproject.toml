[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-pitwall"
version = "0.1.0"
requires-python = ">=3.12"
description = "Local race engineering and F1 2026 UDP telemetry"
readme = "README.md"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
apex-pitwall = "pitwall.server:main"

[tool.setuptools.packages.find]
include = ["pitwall"]

[tool.setuptools.package-data]
pitwall = ["*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
